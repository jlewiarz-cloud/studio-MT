<body>
  <div id="root" style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;color:#8a8a8a;">
      <div style="font-size:48px;margin-bottom:12px;">🏋️‍♀️</div>
      <div style="font-size:14px;">Wczytywanie...</div>
    </div>
  </div>

  <script>
  fetch('app.js')
    .then(function(r) { return r.text(); })
    .then(function(code) { new Function(code)(); })
    .catch(function(e) {
      document.getElementById('root').innerHTML =
        '<div style="padding:20px;text-align:center;color:#c65d3e;">' +
        '<h2>Błąd ładowania</h2><p>' + e.message + '</p>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;background:#2d3f2f;color:#fff;border:none;border-radius:8px;">Odśwież</button></div>';
    });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  </script>
